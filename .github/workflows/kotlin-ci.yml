name: Kotlin CI

on:
  workflow_call:
    secrets:
      GH_PACKAGES_USER:
        required: true
      GH_PACKAGES_READ_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        run: bash ./gradlew build --no-daemon
        env:
          GITHUB_ACTOR: ${{ secrets.GH_PACKAGES_USER }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}