name: Frontend CI
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: Frontend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Browser integration against contracts
        id: browser-contracts
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:5173
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/ui-vite.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent "$CYPRESS_BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$CYPRESS_BASE_URL/" > /dev/null
          npm run test:contracts
      - name: Show Vite diagnostics on failure
        if: ${{ failure() && steps.browser-contracts.outcome == 'failure' }}
        run: |
          # Print only recognized messages so arbitrary log content stays private.
          grep -Eo \
            -e 'VITE v[0-9.]+[[:space:]]+ready in [0-9]+ ms|http://127\.0\.0\.1:5173/' \
            -e 'error when starting dev server|failed to load config|Internal server error|Pre-transform error' \
            -e 'ERR_MODULE_NOT_FOUND|Cannot find (module|package)|EADDRINUSE|EACCES|ENOTFOUND|ENOENT' \
            "$RUNNER_TEMP/ui-vite.log" || echo 'No recognized Vite diagnostics in the log.'
      - name: Packaged UI runtime acceptance
        if: github.event_name == 'pull_request'
        run: npm run test:container
