name: Tag published image

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias the existing digest without rebuilding
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          commit=$(git rev-parse HEAD)
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          digest=$(docker buildx imagetools inspect "$image:sha-$commit" --format '{{json .Manifest}}' | jq -er '.digest')
          existing=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest') || existing=''
          if [[ -n "$existing" && "$existing" != "$digest" ]]; then
            echo 'Version already refers to another digest; create a new version.' >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$image:$VERSION" "$image@$digest"
          fi
          released=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$released" == "$digest" ]] || { echo 'Release digest differs from source'; exit 1; }
          printf 'Release `%s:%s` → `%s` (no rebuild)\n' "$image" "$VERSION" "$digest" >> "$GITHUB_STEP_SUMMARY"
