name: CD

on:
  workflow_call:
    inputs:
      image-name:
        description: Paquete GHCR exacto del servicio caller.
        required: true
        type: string
      platforms:
        default: linux/amd64
        type: string
      publish:
        description: Publicar desde dev; pedirlo desde main falla.
        default: false
        type: boolean
      deploy:
        description: Desplegar después de CI; habilitación gradual.
        default: false
        type: boolean
    secrets:
      GH_PACKAGES_USER:
        required: true
      GH_PACKAGES_READ_TOKEN:
        required: true
      SSH_PRIVATE_KEY:
        required: false
      SSH_KNOWN_HOSTS:
        required: false


env:
  INFRA_REVISION: c2180b28abc1b44b9aecfdf855ff7af544339523
  PUBLISH_REQUESTED: ${{ inputs.publish }}
  PROD_DEPLOY_ENABLED: ${{ vars.PROD_DEPLOY_ENABLED }}

jobs:
  publish:
    name: Build & Publish Docker Image
    if: github.ref == 'refs/heads/dev' && (inputs.publish || inputs.deploy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      artifact: ${{ steps.publication.outputs.artifact }}
    steps:
      - name: Checkout the verified service
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Checkout trusted CD tools
        uses: actions/checkout@v7
        with:
          repository: JJT-INGSIS/snippet-searcher-infra
          ref: ${{ env.INFRA_REVISION }}
          path: infra
          persist-credentials: false
      - name: Prepare publication metadata
        id: source
        working-directory: source
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          PLATFORMS: ${{ inputs.platforms }}
        run: python3 ../infra/scripts/cd_evidence.py source
      - name: Set up QEMU for ARM64
        if: contains(inputs.platforms, 'linux/arm64')
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.source.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.jjt.source-tree=${{ steps.source.outputs.tree }}
            io.jjt.actions-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            io.jjt.actions-run-attempt=${{ github.run_attempt }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./source
          file: ./source/Dockerfile
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_actor=${{ secrets.GH_PACKAGES_USER }}
            github_token=${{ secrets.GH_PACKAGES_READ_TOKEN }}
          cache-from: type=gha,version=2,scope=${{ steps.source.outputs.cache-scope }}
          cache-to: type=gha,version=2,scope=${{ steps.source.outputs.cache-scope }},mode=max
      - name: Export published artifact
        id: publication
        env:
          IMAGE_NAME: ${{ steps.source.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: python3 infra/scripts/cd_evidence.py published

  select:
    name: Select verified DEV image
    if: github.ref == 'refs/heads/main' && (inputs.publish || inputs.deploy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      artifact: ${{ steps.select.outputs.artifact }}
    steps:
      - name: Checkout trusted CD tools
        uses: actions/checkout@v7
        with:
          repository: JJT-INGSIS/snippet-searcher-infra
          ref: ${{ env.INFRA_REVISION }}
          path: infra
          persist-credentials: false
      - name: Select exact historical evidence
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/scripts/cd_evidence.py select

  deploy:
    name: Deploy and verify
    needs: [publish, select]
    if: >-
      always() && !cancelled() && inputs.deploy &&
      ((github.ref == 'refs/heads/dev' && needs.publish.result == 'success') ||
       (github.ref == 'refs/heads/main' && needs.select.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    concurrency:
      group: sni25-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
    env:
      ARTIFACT: ${{ needs.publish.outputs.artifact || needs.select.outputs.artifact }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted CD tools
        uses: actions/checkout@v7
        with:
          repository: JJT-INGSIS/snippet-searcher-infra
          ref: ${{ env.INFRA_REVISION }}
          path: infra
          persist-credentials: false
      - name: Validate image and prepare deployment
        run: python3 infra/scripts/cd_evidence.py prepare "$RUNNER_TEMP/request.json"
      - name: Deploy through strict SSH
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: python3 infra/scripts/ssh_deploy.py "$RUNNER_TEMP/request.json" "$RUNNER_TEMP/receipt.json"
      - name: Record verified DEV evidence
        if: github.ref == 'refs/heads/dev'
        run: python3 infra/scripts/cd_evidence.py record "$RUNNER_TEMP/receipt.json"
      - name: Deployment summary
        if: always()
        run: python3 infra/scripts/cd_evidence.py summary "$RUNNER_TEMP/receipt.json"
