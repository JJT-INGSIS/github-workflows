name: Kotlin service pipeline

on:
  workflow_call:
    inputs:
      publish:
        description: Publicar la imagen después de CI, exclusivamente desde dev.
        required: false
        default: false
        type: boolean
      image-name:
        description: Nombre completo del paquete GHCR del servicio caller.
        required: false
        default: ''
        type: string
      platforms:
        description: Plataformas Linux separadas por comas, sin espacios.
        required: false
        default: linux/amd64
        type: string
      deploy:
        description: Desplegar después de CI; habilitación gradual de SNI-25.
        required: false
        default: false
        type: boolean
    secrets:
      GH_PACKAGES_USER:
        required: true
      GH_PACKAGES_READ_TOKEN:
        required: true
      SSH_PRIVATE_KEY:
        required: false
      SSH_KNOWN_HOSTS:
        required: false

jobs:
  verify:
    permissions:
      contents: read
    uses: $/.github/workflows/kotlin-ci.yml
    secrets:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
      GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}

  result:
    name: Resultado requerido
    needs: verify
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Confirmar CI completo
        env:
          CI_RESULT: ${{ needs.verify.result }}
        run: test "$CI_RESULT" = success

  cd:
    needs: verify
    if: >-
      (inputs.publish || inputs.deploy) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      deployments: write
    uses: $/.github/workflows/cd.yml
    with:
      publish: ${{ inputs.publish }}
      image-name: ${{ inputs.image-name }}
      platforms: ${{ inputs.platforms }}
      deploy: ${{ inputs.deploy }}
    secrets:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
      GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
