name: Validate reusable workflows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate YAML, expressions, shell and reusable contracts
        run: python3 scripts/lint_workflows.py
